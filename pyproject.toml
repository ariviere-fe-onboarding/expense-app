[project]
name = "fernway-expense-app"
version = "1.0.0"
description = "Fernway expense reporting: submit, approve, reimburse."
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
