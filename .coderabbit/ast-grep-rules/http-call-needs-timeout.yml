id: http-call-needs-timeout
language: python
severity: error
message: >-
  Observation: outbound HTTP call without an explicit timeout. A slow or unresponsive
  peer will hold this worker indefinitely. Fernway's security guideline requires a
  timeout on every outbound request.
rule:
  all:
    - pattern: $CLIENT.$METHOD($$$ARGS)
    - not:
        has:
          kind: argument_list
          has:
            kind: keyword_argument
            regex: "^timeout\\s*="
constraints:
  CLIENT:
    regex: "^(httpx|requests)$"
  METHOD:
    regex: "^(get|post|put|patch|delete|head|request|stream)$"
