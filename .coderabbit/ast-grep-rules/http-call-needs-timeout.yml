id: http-call-needs-timeout
language: python
severity: error
message: >-
  Observation: outbound HTTP call without an explicit timeout. It relies on the
  library default (none for requests, 5 seconds for httpx) instead of a limit chosen for
  this call. Fernway's security guideline requires an explicit timeout on every outbound
  request.
rule:
  all:
    - pattern: $CLIENT.$METHOD($$$ARGS)
    - not:
        has:
          kind: argument_list
          has:
            kind: keyword_argument
            regex: "^timeout\\s*="
constraints:
  CLIENT:
    regex: "^(httpx|requests)$"
  METHOD:
    regex: "^(get|post|put|patch|delete|head|request|stream)$"
