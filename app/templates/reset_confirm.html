{% extends "base.html" %}
{% block title %}Choose a new password · Fernway Expenses{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Choose a new password</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/password-reset/confirm">
    <input type="hidden" name="token" value="{{ token }}">
    <label>New password <input type="password" name="password" minlength="12" autocomplete="new-password" required></label>
    <button type="submit">Update password</button>
  </form>
</section>
{% endblock %}
