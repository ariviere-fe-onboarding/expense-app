{% extends "base.html" %}
{% block title %}Reset password · Fernway Expenses{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Reset your password</h1>
  <p>We'll email you a link that works once and expires in 30 minutes. Locally, messages are written to <code>.local/mail/</code>.</p>
  <form method="post" action="/password-reset">
    <label>Email <input type="email" name="email" required></label>
    <button type="submit">Send reset link</button>
  </form>
</section>
{% endblock %}
